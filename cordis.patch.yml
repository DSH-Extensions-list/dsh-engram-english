# Preserve the English Granite model and existing local stores across the upstream upgrade.
- insert:
    - id: dsh-engram
      name: '@arzvaak/dsh-engram-english'
      config:
        dbDir: '/home/sushi/.local/share/deepseek-harness/home/engram'
        modelCacheDir: '/home/sushi/.local/share/deepseek-harness/home/engram/models'
        ingest: 'light'
        historyBackfillIncludeSubagents: false
        historyBackfillIncludeSeeded: false
        historyBackfillIncludeNoCwd: false
        language: 'en'
        embedder:
          kind: 'local'
          localModel: 'onnx-community/granite-embedding-small-english-r2-ONNX'
          localPooling: 'mean'
